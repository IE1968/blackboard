<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackboard</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101617">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Blackboard">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: Werkzeugleiste oben, Formenleiste links (einklappbar), Tafel füllt den Rest. Oberfläche immer dunkel, Tafel hell oder schwarz umschaltbar. */
  color-scheme:dark;
  --paper:#fbfbf8; --dot:#c4cdcf; --paper-muted:#5d6c70; --hint-bg:rgba(251,251,248,.85);
  --chrome:#101617; --panel:#1b2325; --ink:#e8efef; --muted:#9aabad; --line:#334144;
  --accent:#43bcc4; --accent-ink:#06282b; --hover:#2a3638;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
#stage.dark{--paper:#0d1011;--dot:#333d40;--paper-muted:#8e9fa2;--hint-bg:rgba(13,16,17,.85)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--chrome);color:var(--ink);font:400 14px/1.35 var(--body);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:8px}
button:focus-visible,.pal:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button:disabled{opacity:.35;cursor:default}

header{position:relative;min-width:0;border-bottom:1px solid var(--line);background:var(--panel)}
.bar{display:flex;align-items:center;gap:14px;padding:6px 12px;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;font:800 28px/1 var(--display);letter-spacing:-.02em;white-space:nowrap;padding:2px 6px 2px 0}
.brand .logo{width:32px;height:32px;fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.brand i{font-style:normal;color:var(--accent)}
.grp{display:flex;align-items:center;gap:2px}
.sep{width:1px;align-self:stretch;background:var(--line);margin:4px 0}
.tb{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:52px;padding:5px 6px 4px;font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap}
.tb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.tb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.spacer{flex:1}
#boardName{width:150px;flex:none;font:500 14px/1.2 var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
#boardName:hover,#boardName:focus{border-color:var(--accent);outline:none}
.mh{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px}
#boardList{display:flex;flex-direction:column}
#boardList button[aria-current="true"]{font-weight:600;color:var(--accent)}
#zoomLabel{min-width:54px;padding:8px 6px;font-weight:500;font-variant-numeric:tabular-nums;font-size:13px}
#zoomLabel:hover{background:var(--hover)}
#menu{position:absolute;right:10px;top:calc(100% + 6px);z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;min-width:250px;max-height:calc(100vh - 80px);overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.18)}
#menu button{text-align:left;padding:9px 12px}
#menu button:hover{background:var(--hover)}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px;width:auto}

main{--palw:184px;--propw:104px;position:relative;display:grid;grid-template-columns:var(--palw) minmax(0,1fr) var(--propw);min-height:0}
main.props-closed{--propw:0px}
main.pal-closed{--palw:0px}
#palHandle{position:absolute;left:var(--palw);top:50%;transform:translateY(-50%);z-index:15;width:28px;height:92px;padding:0;border-radius:0 12px 12px 0;background:var(--panel);border:1px solid var(--line);border-left:0;color:var(--ink);font-size:24px;line-height:1}
#palHandle:hover,#propsToggle:hover{color:var(--ink);background:var(--hover)}
#propsToggle{position:absolute;right:var(--propw);top:50%;transform:translateY(-50%);z-index:6;width:28px;height:92px;padding:0;border-radius:12px 0 0 12px;background:var(--panel);border:1px solid var(--line);border-right:0;color:var(--ink);font-size:24px;line-height:1}
#palette{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px 10px 20px}
.gh{display:flex;align-items:center;gap:6px;width:100%;font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:9px 4px;margin-top:4px;text-align:left}
.gh:hover{background:var(--hover);color:var(--ink)}
.gh::before{content:'▾';font-size:11px;width:10px}
.gh[aria-expanded="false"]::before{content:'▸'}
#palToggle{margin:0 0 4px;border:1px solid var(--line);justify-content:center;white-space:nowrap}
#palToggle::before{content:none}
main.pal-closed #palette{padding:0;border:0;overflow:hidden}
main.pal-closed #palette .gh:not(#palToggle),main.pal-closed #palette .palgrid{display:none}
.palgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px}
.pal{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;padding:9px 2px 6px;border:1px solid var(--line);border-radius:10px;font-size:11px;line-height:1.15;text-align:center;color:var(--ink);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y;min-height:62px}
.pal:hover{background:var(--hover);border-color:var(--accent)}
.pal svg{width:44px;height:28px;overflow:visible;pointer-events:none}
.pal span{pointer-events:none}
#ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%);background:#fff;color:#1c2a2e;border:2px solid #0a7f88;border-radius:10px;padding:8px 10px;box-shadow:0 8px 22px rgba(0,0,0,.25)}
#ghost svg{width:56px;height:36px;overflow:visible;display:block}

#stage{position:relative;min-width:0;min-height:0;background:var(--paper);overflow:hidden}
#board{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
#board.t-pen,#board.t-brush,#board.t-marker{cursor:crosshair}#board.t-conn{cursor:crosshair}#board.t-text{cursor:text}#board.t-erase{cursor:cell}#board.t-pan{cursor:grab}
#board .it{cursor:move}
#board.t-pen .it,#board.t-brush .it,#board.t-marker .it,#board.t-conn .it,#board.t-text .it{cursor:inherit}
#board.noconn .conn,#board.noconn #overlay{pointer-events:none}
#board [data-h^="rs:n"],#board [data-h^="rs:s"]{cursor:ns-resize}
#board [data-h="rs:e"],#board [data-h="rs:w"]{cursor:ew-resize}
#board [data-h="rs:nw"],#board [data-h="rs:se"]{cursor:nwse-resize}
#board [data-h="rs:ne"],#board [data-h="rs:sw"]{cursor:nesw-resize}
#board [data-h^="cn"],#board [data-h^="ce"]{cursor:crosshair}
#editor{position:absolute;z-index:10;margin:0;border:2px solid #0a7f88;border-radius:4px;background:#fff;color:#1c2a2e;resize:none;outline:none;text-align:center;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
#hint{position:absolute;left:12px;top:10px;font-size:12px;color:var(--paper-muted);background:var(--hint-bg);padding:4px 8px;border-radius:6px;pointer-events:none;max-width:calc(100% - 24px)}
#props{min-width:0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:12px 8px 20px;background:var(--panel);border-left:1px solid var(--line)}
main.props-closed #props{padding:0;border:0;overflow:hidden}
.pg{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-items:center;min-width:0}
.pg>b{grid-column:1/-1;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sws{grid-column:1/-1;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;justify-items:center}
.sws.two{grid-template-columns:repeat(2,minmax(0,1fr));justify-items:stretch;gap:6px}
.wbtn{min-height:28px;display:flex;align-items:center;justify-content:center}
.wbtn .lw{width:58px}
.sws.three{grid-template-columns:repeat(3,minmax(0,1fr));justify-items:stretch;gap:6px}
.sws.five{grid-template-columns:repeat(5,minmax(0,1fr));justify-items:stretch;gap:4px}
.sws.five .pb{padding:0;min-height:32px;display:flex;align-items:center;justify-content:center}
.sws.five .lw{width:16px}
.sw{width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.35);padding:0;flex:none}
.sw.none{background:linear-gradient(135deg,#fff 44%,#c8321f 46%,#c8321f 54%,#fff 56%)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.pb{padding:7px 2px;font-size:12px;font-weight:500;border:1px solid var(--line);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb.wide{grid-column:1/-1}
.pb:hover{background:var(--hover)}
.pb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pb.danger{color:#ff8f7a}
.lw{display:inline-block;width:18px;background:currentColor;border-radius:3px;vertical-align:middle}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:500;padding:8px 14px;border-radius:10px;font-size:13px;z-index:20;max-width:calc(100% - 24px)}

@media (max-width:720px){
  #boardName{width:110px}
  main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  #palette{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:8px 10px}
  .gh{width:auto;flex:none;white-space:nowrap;margin:0;border:1px solid var(--line)}
  #palToggle{margin:0}
  main.pal-closed #palette{padding:0;border:0;height:0}
  #palHandle{left:0}
  #props{position:absolute;right:0;top:0;bottom:0;width:104px;z-index:14;box-shadow:-8px 0 24px rgba(0,0,0,.35)}
  main.props-closed #props{display:none}
  .palgrid{display:flex;gap:6px}
  .pal{min-width:68px;touch-action:pan-x}
  .tb{min-width:40px}.tb span{display:none}
  .brand{font-size:21px}.brand .logo{width:24px;height:24px}
  #hint{display:none}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><svg class="logo" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="4" width="24" height="16" rx="3"/><path d="M7 15l4-5 3 3 3-4 4 5M10 25h8M14 20v5"/></svg><span>Black<i>board</i></span></div>
    <input id="boardName" type="text" maxlength="40" aria-label="Name des Boards" title="Name des Boards (zum Umbenennen einfach tippen)">
    <div class="grp" id="tools" role="toolbar" aria-label="Werkzeuge">
      <button class="tb" data-tool="select" title="Auswählen und verschieben (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg><span>Auswahl</span></button>
      <button class="tb" data-tool="pen" title="Freihand zeichnen (P)"><svg viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/></svg><span>Stift</span></button>
      <button class="tb" data-tool="brush" title="Pinsel: Strich wird je nach Tempo oder Stiftdruck dicker und dünner (B)"><svg viewBox="0 0 24 24"><path d="M19 4l1.5 1.5-8 9-2.5 1 1-2.5zM9.5 16.5c-2 0-3 1.2-3 2.3S5.500 20 4 20c2.500 1 6.500.500 6.500-2.500"/></svg><span>Pinsel</span></button>
      <button class="tb" data-tool="marker" title="Marker: breit und durchscheinend (M)"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-8 8H7v-5zM4 21h9"/></svg><span>Marker</span></button>
      <button class="tb" data-tool="text" title="Text setzen (T)"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M9 19h6"/></svg><span>Text</span></button>
      <button class="tb" data-tool="erase" title="Radieren (E)"><svg viewBox="0 0 24 24"><path d="M9 19h11M4 14l9-9 6 6-8 8H8z"/></svg><span>Radierer</span></button>
      <button class="tb" data-tool="pan" title="Tafel verschieben (H oder Leertaste halten)"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span>Hand</span></button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="tb" id="undo" title="Rückgängig (Strg+Z)"><svg viewBox="0 0 24 24"><path d="M8 7L4 11l4 4M4 11h10a5 5 0 010 10h-3"/></svg><span>Zurück</span></button>
      <button class="tb" id="redo" title="Wiederholen (Strg+Y)"><svg viewBox="0 0 24 24"><path d="M16 7l4 4-4 4M20 11H10a5 5 0 000 10h3"/></svg><span>Vor</span></button>
    </div>
    <div class="spacer"></div>
    <button class="tb" id="bgBtn" title="Tafel zwischen Schwarz und Weiß umschalten"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 010 16z" fill="currentColor"/></svg><span>Tafel</span></button>
    <div class="grp">
      <button class="tb" id="zoomOut" title="Verkleinern"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <button id="zoomLabel" title="Alles einpassen">100 %</button>
      <button class="tb" id="zoomIn" title="Vergrößern"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
    </div>
    <div class="sep"></div>
    <button class="tb" id="menuBtn" aria-expanded="false" title="Speichern, öffnen, leeren"><svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5zM9 4v5h6M8 20v-6h8v6"/></svg><span>Datei</span></button>
  </div>
  <div id="menu" hidden>
    <div class="mh">Boards</div>
    <div id="boardList"></div>
    <button data-m="new">+ Neues Board</button>
    <button data-m="delboard" id="delBoard">Dieses Board löschen</button>
    <hr>
    <div class="mh">Exportieren</div>
    <button data-m="png">Als Bild (PNG)</button>
    <button data-m="svg">Als Vektorgrafik (SVG)</button>
    <button data-m="pdf">Als PDF (A4)</button>
    <hr>
    <div class="mh">Sicherung</div>
    <button data-m="json">Board als Datei sichern (.json)</button>
    <button data-m="open">Board aus Datei laden …</button>
    <hr>
    <button data-m="example">Beispiel laden</button>
    <button data-m="clear">Board leeren</button>
  </div>
</header>
<main>
  <aside id="palette" aria-label="Formen"></aside>
  <button id="palHandle" aria-controls="palette"></button>
  <section id="stage">
    <svg id="board" xmlns="http://www.w3.org/2000/svg">
      <defs><pattern id="grid" patternUnits="userSpaceOnUse" width="20" height="20"><circle cx="1" cy="1" r="1" fill="var(--dot)"/></pattern></defs>
      <rect width="100%" height="100%" fill="url(#grid)"/>
      <g id="world"><g id="items"></g><g id="overlay"></g></g>
    </svg>
    <textarea id="editor" hidden spellcheck="false" aria-label="Text der Form"></textarea>
    <div id="hint">Form reinziehen · Doppelklick bearbeitet Text · Punkte am Rand einer Form ziehen einen Pfeil</div>
    <div id="toast" hidden role="status"></div>
  </section>
  <aside id="props" aria-label="Farben und Optionen"></aside>
  <button id="propsToggle" aria-controls="props"></button>
</main>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
(function(){
'use strict';
const INK='#1c2a2e', INK_D='#eef3f3';
let SEL='#0a7f88', darkBoard=true;
function tink(){ return darkBoard?INK_D:INK; }
function paper(){ return darkBoard?'#0d1011':'#fbfbf8'; }
function mapC(c){ if(!darkBoard) return c; if(c===INK) return INK_D; if(c==='#ffffff') return '#1b2427'; return c; }
function onFill(f){ return f==='none'?tink():(isDark(mapC(f))?'#ffffff':INK); }
function vis(it){ return Object.assign({},it,{fill:mapC(it.fill),stroke:mapC(it.stroke)}); }
const FONT='system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif';
let FS=14, LH=18, BOLD=false, lastCell=null;
const GRID=10, KEY='blackboard-v1';
function useFont(it){ FS=(it&&it.fs)||14; LH=Math.round(FS*1.3); BOLD=!!(it&&it.bold); }
const COLORS=['none','#1c2a2e','#ffffff','#7a8790','#c8321f','#d97a00','#f2c200','#1f8a4c','#1e63d0','#7446c9','#fff3b0','#ffd9c7','#cfe8ff','#d3f0dc','#e6dcff','#e3e8ea'];
const WIDTHS={shape:[1,2,3,5,8],pen:[1.5,3,5,8,12],brush:[4,8,12,18,26],marker:[8,14,20,28,40]};
const DRAW={pen:'Stift',brush:'Pinsel',marker:'Marker'};
const KINDS={
  rect:{label:'Rechteck',w:140,h:80},
  ellipse:{label:'Ellipse',w:130,h:80},
  text:{label:'Text',w:160,h:30,fill:'none',text:'Text'},
  note:{label:'Notiz',w:150,h:110,fill:'#fff3b0'},
  lineArrow:{label:'Pfeil',line:'arrow',w:140,h:40},
  linePlain:{label:'Linie',line:'none',w:140,h:40},
  gRound:{label:'Abgerundet',as:'round',w:140,h:80},
  gCircle:{label:'Kreis',as:'ellipse',w:90,h:90},
  gDia:{label:'Raute',as:'diamond',w:120,h:90},
  tri:{label:'Dreieck',w:120,h:100},
  hex:{label:'Sechseck',w:140,h:90},
  star:{label:'Stern',w:110,h:110},
  arrowr:{label:'Blockpfeil',w:140,h:70},
  arrowlr:{label:'Doppelpfeil',w:150,h:70},
  bubble:{label:'Sprechblase',w:160,h:110},
  cloud:{label:'Wolke',w:160,h:100},
  cross:{label:'Kreuz',w:90,h:90},
  card:{label:'Karte',w:140,h:70,fill:'#fff3b0'},
  table:{label:'Tabelle',tpl:1,w:360,h:144},
  kanban:{label:'Kanban-Board',tpl:1,w:600,h:400},
  scrum:{label:'Scrum-Board',tpl:1,w:850,h:420},
  term:{label:'Start / Ende',w:130,h:50},
  diamond:{label:'Entscheidung',w:130,h:90},
  io:{label:'Ein-/Ausgabe',w:150,h:70},
  doc:{label:'Dokument',w:140,h:90},
  db:{label:'Datenbank',w:100,h:90},
  evstart:{label:'Start',w:40,h:40},
  evmid:{label:'Zwischen',w:40,h:40},
  evend:{label:'Ende',w:40,h:40},
  evmsg:{label:'Nachricht',w:40,h:40},
  evtimer:{label:'Timer',w:40,h:40},
  round:{label:'Aufgabe',w:140,h:80},
  subproc:{label:'Teilprozess',w:160,h:90},
  gwx:{label:'Gateway XOR',w:50,h:50},
  gwplus:{label:'Gateway UND',w:50,h:50},
  gwo:{label:'Gateway ODER',w:50,h:50},
  data:{label:'Datenobjekt',w:60,h:80},
  pool:{label:'Pool / Lane',w:700,h:220,text:'Pool'},
  annot:{label:'Anmerkung',w:160,h:60,fill:'none'},
  erent:{label:'Entität',as:'rect',w:140,h:60,text:'Entität'},
  erweak:{label:'Schwache Entität',w:140,h:60},
  errel:{label:'Beziehung',as:'diamond',w:130,h:70},
  erattr:{label:'Attribut',as:'ellipse',w:110,h:50},
  erkey:{label:'Schlüssel',w:110,h:50,text:'id'},
  ertable:{label:'Entitäts-tabelle',tpl:1,w:170,h:116},
  umlclass:{label:'Klasse',tpl:1,w:190,h:132},
  umliface:{label:'Interface',tpl:1,w:190,h:96},
  umlactor:{label:'Akteur',w:40,h:70},
  umlcase:{label:'Anwendungs-fall',as:'ellipse',w:150,h:70},
  umlpkg:{label:'Paket',w:160,h:100},
  umlnote:{label:'UML-Notiz',w:140,h:70},
  umllife:{label:'Lebenslinie',w:120,h:260},
  nsstmt:{label:'Anweisung',as:'rect',w:240,h:40},
  nsif:{label:'Verzweigung',w:240,h:60,text:'Bedingung?'},
  nsloop:{label:'Schleife (Kopf)',w:240,h:120,text:'solange …'},
  nsloopf:{label:'Schleife (Fuß)',w:240,h:120,text:'bis …'},

/* ---------- Verlauf und Speicher ---------- */
const IDX='blackboard-boards', BK='blackboard-b-';

    cards=[[0,55,'Aufgabe 1',Y],[0,140,'Aufgabe 2',Y],[1,55,'Aufgabe 3',B],[2,55,'Aufgabe 4',G]]; }
  else if(kind==='scrum'){ t=mkTable([170,170,170,170,170],[40,380],['Product Backlog','Sprint Backlog','In Progress','Review','Done']);
    cards=[[0,55,'User Story 3',Y],[0,140,'User Story 4',Y],[1,55,'Task A',Y],[1,140,'Task B',Y],[2,55,'Task C',B],[3,55,'Task D',O],[4,55,'Task E',G]]; }

function deleteSel(){ if(!sel.size) return; removeIds(sel); sel.clear(); commit(); render(); }
function duplicateSel(){
  const src=doc.items.filter(i=>sel.has(i.id)); if(!src.length) return;
  const map={}; const copies=src.map(i=>{ const c=JSON.parse(JSON.stringify(i)); c.id=nid(); map[i.id]=c.id; return c; });
  src.forEach((i,ix)=>{ const c=copies[ix];

    else if(c.type==='path') c.pts=c.pts.map(p=>[p[0]+20,p[1]+20]);

      if(map[c.to]) c.to=map[c.to]; else { c.to=null; const l=pts[pts.length-1]; c.p2={x:l.x+20,y:l.y+20}; } } });
  doc.items.push(...copies); sel=new Set(copies.map(c=>c.id)); commit(); render();
}

/* ---------- Eigenschaftenleiste ---------- */
function updateProps(){
  const items=[...sel].map(byId).filter(Boolean), penMode=!items.length, pt=$('propsToggle'), shut=!!palState.propsClosed;
  document.querySelector('main').classList.toggle('props-closed',shut);
  pt.textContent=shut?'‹':'›'; pt.setAttribute('aria-expanded',!shut); pt.title=shut?'Farben und Optionen ausklappen':'Farben und Optionen einklappen';
  const ps=penStyles[drawTool], cur=items[0]||ps, hasShape=items.some(i=>i.type==='shape'), conns=items.filter(i=>i.type==='conn'), paths=items.filter(i=>i.type==='path');
  const sws=(act,on,none)=>`<div class="sws">`+COLORS.filter(c=>none||c!=='none').map(c=>`<button class="sw${c==='none'?' none':''}" data-act="${act}" data-val="${c}" aria-pressed="${on===c}" title="${c==='none'?'Ohne':'Farbe wählen'}" style="${c==='none'?'':'background:'+mapC(c)}"></button>`).join('')+`</div>`;
  let h='';
  const texty=items.filter(i=>i.type!=='path');
  if(texty.length) h+=`<div class="pg"><b>Text</b>`+(items.length===1?`<button class="pb wide" data-act="edit">Text ändern</button>`:'')+`<div class="sws two"><button class="pb" data-act="fsdown" title="Schrift kleiner">A−</button><button class="pb" data-act="fsup" title="Schrift größer">A+</button></div><button class="pb wide" data-act="bold" aria-pressed="${!!texty[0].bold}">Fett</button></div>`;
  if(hasShape) h+=`<div class="pg"><b>Füllung</b>${sws('fill',(items.find(i=>i.type==='shape')||{}).fill,true)}</div>`;
  h+=`<div class="pg"><b>${penMode?DRAW[drawTool]+'farbe':'Linie'}</b>${sws('stroke',cur.stroke,hasShape&&!conns.length&&!paths.length)}</div>`;
  const wl=penMode?WIDTHS[drawTool]:(cur.type==='path'?WIDTHS[cur.tool||'pen']:WIDTHS.shape);
  let near=0; wl.forEach((v,i)=>{ if(Math.abs(v-cur.sw)<Math.abs(wl[near]-cur.sw)) near=i; });
  h+=`<div class="pg"><b>Stärke</b>`+wl.map((v,i)=>`<button class="pb wbtn" data-act="sw" data-val="${v}" aria-pressed="${i===near}" title="Stärke ${i+1} von 5"><i class="lw" style="height:${1.5+i*2.5}px"></i></button>`).join('')+`</div>`;
  if(penMode||paths.length){ const tip=(paths[0]||ps).tip||'round';
    h+=`<div class="pg"><b>Pinselform</b>`+[['round','Rund'],['flat','Flach'],['calli','Schräg']].map(([v,t])=>`<button class="pb" data-act="tip" data-val="${v}" aria-pressed="${tip===v}">${t}</button>`).join('')+`</div>`; }
  if(conns.length){ const c=conns[0];
    h+=`<div class="pg"><b>Pfeil</b><button class="pb" data-act="style" aria-pressed="${c.style==='straight'}">Gerade</button><button class="pb" data-act="dash" aria-pressed="${!!c.dash}" >Gestrichelt</button></div><div class="pg"><b>Spitze</b><button class="pb" data-act="head" title="Pfeilspitze wechseln">${HEADS.find(x=>x[0]===headOf(c))[1]}</button></div>`; }
  if(items.length===1&&items[0].kind==='table') h+=`<div class="pg"><b>Tabelle</b><button class="pb" data-act="addcol">+ Spalte</button><button class="pb" data-act="delcol">− Spalte</button><button class="pb" data-act="addrow">+ Zeile</button><button class="pb" data-act="delrow">− Zeile</button></div>`;
  if(items.length) h+=`<div class="pg"><b>Element</b><button class="pb" data-act="front">Nach vorn</button><button class="pb" data-act="back">Nach hinten</button><button class="pb" data-act="dup">Duplizieren</button><button class="pb danger" data-act="del">Löschen</button></div>`;
  propsEl.innerHTML=h;
}
propsEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act,val=b.dataset.val,items=[...sel].map(byId).filter(Boolean);
  if(act==='front') return reorder(true);
  if(act==='back') return reorder(false);
  if(act==='dup') return duplicateSel();
  if(act==='del') return deleteSel();
  if(act==='edit'){ const it=items[0]; if(it) startEdit(it.id,lastCell&&lastCell.id===it.id?lastCell.cell:null); return; }
  if(!items.length){ const ps=penStyles[drawTool]; if(act==='stroke') ps.stroke=val; if(act==='sw') ps.sw=+val; if(act==='tip') ps.tip=val; updateProps(); return; }
  const tb=items[0];
  if(tb.kind==='table'){
    if(act==='addcol'){ tb.colW.push(tb.colW[tb.colW.length-1]); tb.cells.forEach(row=>row.push('')); }
    if(act==='delcol'&&tb.colW.length>1){ tb.colW.pop(); tb.cells.forEach(row=>row.pop()); }
    if(act==='addrow'){ tb.rowH.push(tb.rowH[tb.rowH.length-1]); tb.cells.push(tb.colW.map(()=>'')); }
    if(act==='delrow'&&tb.rowH.length>1){ tb.rowH.pop(); tb.cells.pop(); }
    tb.w=sum(tb.colW); tb.h=sum(tb.rowH);
  }
  for(const it of items){
    if(it.type!=='path'&&(act==='fsup'||act==='fsdown'||act==='bold')){
      if(act==='bold') it.bold=!it.bold; else it.fs=clamp((it.fs||14)+(act==='fsup'?2:-2),10,40);
      if(it.kind==='text') it.fresh=true; autosize(it); }
    if(act==='fill'&&it.type==='shape') it.fill=val;
    if(act==='stroke'&&(val!=='none'||it.type==='shape')) it.stroke=val;
    if(act==='tip'&&it.type==='path') it.tip=val;
    if(act==='sw') it.sw=+val;
    if(it.type==='conn'){ if(act==='style') it.style=it.style==='straight'?'ortho':'straight'; if(act==='dash') it.dash=!it.dash; if(act==='head'){ const i=HEADS.findIndex(x=>x[0]===headOf(it)); it.head=HEADS[(i+1)%HEADS.length][0]; delete it.arrow; } }
  }
  commit(); render();
});

/* ---------- Zeiger auf der Tafel ---------- */
function shapeAt(cx,cy,exclude){
  const el=document.elementFromPoint(cx,cy), g=el&&el.closest&&el.closest('#items [data-id]'); if(!g) return null;
  const it=byId(g.dataset.id); return it&&it.type==='shape'&&it.kind!=='pool'&&it.kind!=='table'&&it.id!==exclude?it:null;
}
function movers(){
  const ids=new Set(sel);
  for(const id of sel){ const p=byId(id); if(!p||p.type!=='shape'||!isBox(p.kind)) continue;
    for(const o of doc.items){ if(o.id===p.id||o.type==='conn') continue; const b=bbox(o),cx=b.x+b.w/2,cy=b.y+b.h/2;
      if(cx>p.x&&cx<p.x+p.w&&cy>p.y&&cy<p.y+p.h) ids.add(o.id); } }
  return [...ids].map(byId).filter(Boolean).map(it=>({id:it.id,d:JSON.parse(JSON.stringify(it))}));
}
function startConn(base,from,w){
  const c={id:nid(),type:'conn',from:from?from.id:null,to:null,p1:{x:w.x,y:w.y},p2:{x:w.x,y:w.y},text:'',stroke:INK,sw:2,style:'ortho',arrow:true,dash:false};
  doc.items.push(c); sel=new Set([c.id]); action={...base,type:'connEnd',id:c.id,end:'b',isNew:true}; svg.classList.add('noconn'); render();
}
function eraseAt(e){
  const el=document.elementFromPoint(e.clientX,e.clientY), g=el&&el.closest&&el.closest('#items [data-id]');
  if(g){ removeIds(new Set([g.dataset.id])); action.dirty=true; render(); }
}
function cancelAction(){
  if(!action) return;
  if(liveEl){ liveEl.remove(); liveEl=null; }
  if(action.type!=='pan'&&action.type!=='pen'&&hist[hi]) doc=JSON.parse(hist[hi]);
  action=null; hoverId=null; svg.classList.remove('noconn'); render();
}
function touchPair(){ const rc=svg.getBoundingClientRect(),[p,q]=[...touches.values()];
  return {d:Math.hypot(p.x-q.x,p.y-q.y)||1,mx:(p.x+q.x)/2-rc.left,my:(p.y+q.y)/2-rc.top}; }

svg.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button===2) return;
  e.preventDefault(); finishEdit(); menu.hidden=true;
  if(e.pointerType==='touch'){
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(touches.size===2){ cancelAction(); const t=touchPair(); pinch={d:t.d,mx:t.mx,my:t.my,v:{...view}}; return; }
    if(touches.size>2) return;
  }
  try{ svg.setPointerCapture(e.pointerId); }catch(_){}
  const w=toWorld(e.clientX,e.clientY);
  const base={pid:e.pointerId,sx:e.clientX,sy:e.clientY,w0:w,moved:false};
  if(e.button===1||spaceDown||tool==='pan'){ action={...base,type:'pan',vx:view.x,vy:view.y}; return; }
  const hEl=e.target.closest('[data-h]'), iEl=e.target.closest('#items [data-id]'), item=iEl?byId(iEl.dataset.id):null;
  if(DRAW[tool]){
    action={...base,type:'pen',tool,pts:[[r(w.x),r(w.y)]],ws:[0.45],f:0.45,t:performance.now(),lx:e.clientX,ly:e.clientY};
    liveEl=document.createElementNS('http://www.w3.org/2000/svg','g'); liveEl.setAttribute('pointer-events','none');
    liveEl.innerHTML=strokeSVG(Object.assign({pts:action.pts,ws:action.ws,tool},penStyles[tool]));
    itemsG.appendChild(liveEl); return;
  }
  if(tool==='erase'){ action={...base,type:'erase',dirty:false}; eraseAt(e); return; }
  if(tool==='text'){ action={...base,type:'textclick'}; return; }
  if(tool==='conn'){ startConn(base,item&&item.type==='shape'&&item.kind!=='pool'&&item.kind!=='table'?item:null,w); return; }
  if(hEl){
    const [t,v]=hEl.dataset.h.split(':'), one=byId([...sel][0]);
    if(one){
      if(t==='rs'){ action={...base,type:'resize',dir:v,id:one.id,o:{x:one.x,y:one.y,w:one.w,h:one.h,colW:one.colW&&one.colW.slice(),rowH:one.rowH&&one.rowH.slice()}}; return; }
      if(t==='cn'){ startConn(base,one,w); return; }
      if(t==='ce'){ action={...base,type:'connEnd',id:one.id,end:v,isNew:false}; svg.classList.add('noconn'); return; }
    }
  }

    if(item.kind==='table') lastCell={id:item.id,cell:cellAt(item,w)};
    if(e.shiftKey){ sel.has(item.id)?sel.delete(item.id):sel.add(item.id); action={...base,type:'none'}; render(); return; }
    if(!sel.has(item.id)) sel=new Set([item.id]);
    action={...base,type:'move',hitId:item.id,orig:movers()}; render(); return;
  }
  if(!e.shiftKey) sel.clear();
  action={...base,type:'marquee',cur:w}; render();
});
svg.addEventListener('pointermove',e=>{
  if(touches.has(e.pointerId)) touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch){ if(touches.size<2) return; const t=touchPair(),k=clamp(pinch.v.k*t.d/pinch.d,0.15,4);
    const wx=(pinch.mx-pinch.v.x)/pinch.v.k,wy=(pinch.my-pinch.v.y)/pinch.v.k;
    view.k=k; view.x=t.mx-wx*k; view.y=t.my-wy*k; applyView(); return; }
  const a=action; if(!a||a.pid!==e.pointerId) return;
  const w=toWorld(e.clientX,e.clientY);
  if(a.type==='pen'){ const l=a.pts[a.pts.length-1];
    if(Math.hypot(w.x-l[0],w.y-l[1])*view.k>=2){
      if(a.tool==='brush'){ const now=performance.now(), v=Math.hypot(e.clientX-a.lx,e.clientY-a.ly)/Math.max(1,now-a.t);
        const target=(e.pointerType==='pen'&&e.pressure>0)?0.3+e.pressure*1.4:clamp(1.45-v*0.55,0.35,1.45);
        a.f=a.f*0.65+target*0.35; a.ws.push(r(a.f)); a.t=now; a.lx=e.clientX; a.ly=e.clientY; }
      a.pts.push([r(w.x),r(w.y)]);
      liveEl.innerHTML=strokeSVG(Object.assign({pts:a.pts,ws:a.ws,tool:a.tool},penStyles[a.tool])); }
    return; }
  if(a.type==='erase'){ eraseAt(e); return; }
  if(!a.moved&&Math.hypot(e.clientX-a.sx,e.clientY-a.sy)<4) return;
  a.moved=true;
  const sn=e.altKey?(v=>v):snap;
  switch(a.type){
    case 'pan': view.x=a.vx+e.clientX-a.sx; view.y=a.vy+e.clientY-a.sy; applyView(); return;
    case 'move': {
      let dx=w.x-a.w0.x,dy=w.y-a.w0.y; const ref=a.orig.find(o=>o.d.type==='shape');
      if(ref){ dx=sn(ref.d.x+dx)-ref.d.x; dy=sn(ref.d.y+dy)-ref.d.y; }
      for(const o of a.orig){ const it=byId(o.id),d=o.d; if(!it) continue;
        if(it.type==='shape'){ it.x=d.x+dx; it.y=d.y+dy; }
        else if(it.type==='path') it.pts=d.pts.map(p=>[r(p[0]+dx),r(p[1]+dy)]);
        else { it.p1={x:d.p1.x+dx,y:d.p1.y+dy}; it.p2={x:d.p2.x+dx,y:d.p2.y+dy}; } }
      break; }
    case 'resize': {
      const it=byId(a.id),o=a.o,d=a.dir; if(!it) break;
      let x1=o.x,y1=o.y,x2=o.x+o.w,y2=o.y+o.h;
      if(d.includes('w')) x1=Math.min(sn(w.x),x2-20); if(d.includes('e')) x2=Math.max(sn(w.x),x1+20);
      if(d.includes('n')) y1=Math.min(sn(w.y),y2-20); if(d.includes('s')) y2=Math.max(sn(w.y),y1+20);
      it.x=x1; it.y=y1; it.w=x2-x1; it.h=y2-y1;
      if(it.kind==='table'){ it.colW=o.colW.map(v=>r(v*it.w/o.w)); it.rowH=o.rowH.map(v=>r(v*it.h/o.h)); }
      if(isSq(it.kind)){ const m=Math.max(it.w,it.h); if(d.includes('w')) it.x=x2-m; if(d.includes('n')) it.y=y2-m; it.w=it.h=m; }
      break; }
    case 'connEnd': {
      const c=byId(a.id); if(!c) break;
      if(a.end==='a'){ c.from=null; c.p1={x:w.x,y:w.y}; } else { c.to=null; c.p2={x:w.x,y:w.y}; }
      const t=shapeAt(e.clientX,e.clientY,a.end==='a'?c.to:c.from); hoverId=t?t.id:null; break; }
    case 'marquee': a.cur=w; renderOverlay(); return;
    default: return;
  }
  render();
});
function tap(id,e){
  const now=performance.now();
  if(lastTap&&now-lastTap.t<420&&lastTap.id===id&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<26){
    lastTap=null; const ti=id&&byId(id); if(ti) startEdit(id,ti.kind==='table'?cellAt(ti,toWorld(e.clientX,e.clientY)):null); else if(tool==='select') newTextAt(toWorld(e.clientX,e.clientY)); return true; }
  lastTap={t:now,id,x:e.clientX,y:e.clientY}; return false;
}
function onUp(e){
  touches.delete(e.pointerId);
  if(pinch){ if(touches.size<2) pinch=null; return; }
  const a=action; if(!a||a.pid!==e.pointerId) return;
  action=null; hoverId=null; svg.classList.remove('noconn');
  if(e.type==='pointercancel'){ action=a; cancelAction(); return; }
  switch(a.type){
    case 'pen': if(liveEl){ liveEl.remove(); liveEl=null; }
      { const ps=penStyles[a.tool], it={id:nid(),type:'path',pts:a.pts,stroke:ps.stroke,sw:ps.sw,tool:a.tool,tip:ps.tip};
        if(a.tool==='brush'){ const n=a.ws.length; [0.45,0.7,0.88].forEach((q,k)=>{ if(n-1-k>0) a.ws[n-1-k]=r(a.ws[n-1-k]*q); }); it.ws=a.ws; }
        doc.items.push(it); commit(); }
      break;
    case 'erase': if(a.dirty) commit(); break;
    case 'textclick': if(!a.moved){ setTool('select'); newTextAt(a.w0); return; } break;
    case 'connEnd': {
      const c=byId(a.id); if(!c) break;
      if(a.moved){ const t=shapeAt(e.clientX,e.clientY,a.end==='a'?c.to:c.from); if(t){ if(a.end==='a') c.from=t.id; else c.to=t.id; } }
      if(a.isNew){ const pts=route(c),f=pts[0],l=pts[pts.length-1];
        if(!a.moved||Math.hypot(l.x-f.x,l.y-f.y)<12){ removeIds(new Set([c.id])); sel.clear(); if(a.moved) break; doc=JSON.parse(hist[hi]); break; } }
      commit(); break; }
    case 'move': if(a.moved) commit(); else if(tap(a.hitId,e)) return; break;
    case 'resize': { const it=byId(a.id); if(it&&a.moved){ if(it.kind==='text'||it.kind==='table') autosize(it); commit(); } break; }
    case 'marquee':
      if(a.moved){ const x1=Math.min(a.w0.x,a.cur.x),y1=Math.min(a.w0.y,a.cur.y),x2=Math.max(a.w0.x,a.cur.x),y2=Math.max(a.w0.y,a.cur.y);
        for(const it of doc.items){ const b=bbox(it);
          const inside=b.x>=x1&&b.y>=y1&&b.x+b.w<=x2&&b.y+b.h<=y2, hit=b.x<x2&&b.x+b.w>x1&&b.y<y2&&b.y+b.h>y1;
          if(it.type==='shape'&&isBox(it.kind)?inside:hit) sel.add(it.id); } }
      else if(tap(null,e)) return;
      break;
  }
  render();
}
svg.addEventListener('pointerup',onUp);
svg.addEventListener('pointercancel',onUp);
svg.addEventListener('wheel',e=>{
  e.preventDefault(); const rc=svg.getBoundingClientRect();
  if(e.ctrlKey||e.metaKey) zoomAt(e.clientX-rc.left,e.clientY-rc.top,Math.exp(-e.deltaY*0.01));
  else { view.x-=e.deltaX; view.y-=e.deltaY; applyView(); }
},{passive:false});

/* ---------- Palette ---------- */
function iconFor(kind,W,H){
  const d=KINDS[kind];
  if(d.line) return `<svg viewBox="0 0 ${W} ${H}"><path d="M4 ${H-6}L${W-(d.line==='arrow'?9:4)} ${d.line==='arrow'?9:6}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>${d.line==='arrow'?`<polygon points="${W-3},5 ${W-13},7 ${W-7},14" fill="currentColor"/>`:''}</svg>`;
  if(kind==='text') return `<svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H*0.75}" text-anchor="middle" font-size="${H*0.7}" font-weight="600" fill="currentColor">Aa</text></svg>`;
  if(d.tpl){
    const one=kind==='ertable'||kind==='umlclass'||kind==='umliface', n=one?1:kind==='scrum'?5:3, tw=one?W*0.55:W;
    const fr=kind==='table'?[1/3,1/3,1/3]:kind==='ertable'?[0.28,0.24,0.24,0.24]:kind==='umlclass'?[0.3,0.35,0.35]:kind==='umliface'?[0.42,0.58]:[0.24,0.76];
    let b=shapeBody({kind:'table',w:tw,h:H,colW:Array(n).fill(tw/n),rowH:fr.map(v=>v*H),fill:'none',stroke:'currentColor',sw:1.6});
    const cw=tw/n, cd=(c,y)=>`<rect x="${c*cw+1.5}" y="${y}" width="${cw-3}" height="${H*0.17}" rx="1" fill="currentColor" opacity=".55"/>`;
    if(kind==='kanban') b+=cd(0,H*0.32)+cd(0,H*0.56)+cd(1,H*0.32)+cd(2,H*0.32);
    if(kind==='scrum') b+=cd(0,H*0.32)+cd(0,H*0.56)+cd(1,H*0.32)+cd(2,H*0.32)+cd(3,H*0.32)+cd(4,H*0.32);
    return `<svg viewBox="${-(W-tw)/2-1} -1 ${W+2} ${H+2}">${b}</svg>`;
  }
  const sc=Math.min(W/d.w,H/d.h), w=d.w*sc, h=d.h*sc;
  const body=shapeBody({kind:d.as||kind,w,h,fill:kind==='note'?'#f4d95a':'none',stroke:'currentColor',sw:1.6});
  return `<svg viewBox="${-(W-w)/2-1} ${-(H-h)/2-1} ${W+2} ${H+2}">${body}</svg>`;
}
try{ const ps=JSON.parse(localStorage.getItem('blackboard-pal')); if(ps&&ps.open) palState=ps; }catch(e){}

    kinds.map(k=>`<button class="pal" data-kind="${k}" title="${KINDS[k].label} auf die Tafel ziehen">${iconFor(k,44,28)}<span>${KINDS[k].label}</span></button>`).join('')+`</div>`).join('');
}

let dropN=0;
palEl.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.pal'); if(!b||(e.pointerType==='mouse'&&e.button!==0)) return;
  const kind=b.dataset.kind,pid=e.pointerId,sx=e.clientX,sy=e.clientY; let ghost=null;
  const mv=ev=>{ if(ev.pointerId!==pid) return;
    if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>7){ ghost=document.createElement('div'); ghost.id='ghost'; ghost.innerHTML=iconFor(kind,56,36); document.body.appendChild(ghost); }
    if(ghost){ ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px'; ev.preventDefault(); } };
  const up=ev=>{ if(ev.pointerId!==pid) return;
    window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
    const dragged=!!ghost; if(ghost) ghost.remove(); if(ev.type==='pointercancel') return;
    finishEdit(); const rc=svg.getBoundingClientRect();
    if(dragged){ if(ev.clientX>=rc.left&&ev.clientX<=rc.right&&ev.clientY>=rc.top&&ev.clientY<=rc.bottom) addShape(kind,toWorld(ev.clientX,ev.clientY),ev.pointerType); }
    else { const o=(dropN++%6)*20; addShape(kind,toWorld(rc.left+rc.width/2+o,rc.top+rc.height/2+o),ev.pointerType); } };
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
});

/* ---------- Leisten, Menü, Tastatur ---------- */
$('tools').addEventListener('click',e=>{ const b=e.target.closest('[data-tool]'); if(b){ finishEdit(); setTool(b.dataset.tool); } });
function setBoardBg(d,keep){
  darkBoard=d; SEL=d?'#43bcc4':'#0a7f88'; $('stage').classList.toggle('dark',d); editor.style.borderColor=SEL;
  if(!keep){ lsSet('blackboard-bg',d?'dark':'light'); render(); }
}
$('bgBtn').onclick=()=>{ finishEdit(); setBoardBg(!darkBoard); };
$('undo').onclick=undo; $('redo').onclick=redo;
$('zoomIn').onclick=()=>zoomCenter(1.25); $('zoomOut').onclick=()=>zoomCenter(0.8); $('zoomLabel').onclick=fit;
$('menuBtn').onclick=e=>{ e.stopPropagation(); renderBoardList(); menu.hidden=!menu.hidden; $('menuBtn').setAttribute('aria-expanded',!menu.hidden); };
document.addEventListener('click',e=>{ if(!menu.hidden&&!menu.contains(e.target)){ menu.hidden=true; $('menuBtn').setAttribute('aria-expanded','false'); } });

function buildSVG(){
  const b=contentBox(30); if(!b) return null;
  const ed=editing; editing=null; const body=doc.items.map(itemSVG).join(''); editing=ed;
  return {w:b.w,h:b.h,svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${b.w}" height="${b.h}" viewBox="${b.x} ${b.y} ${b.w} ${b.h}"><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="${darkBoard?paper():'#ffffff'}"/>${body}</svg>`};
}
async function getDl(){
  if(dl) return dl;
  for(let i=0;i<20&&!(window.claude&&window.claude.use);i++) await new Promise(r=>setTimeout(r,150));
  try{ dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null; }catch(e){ dl=null; }
  return dl;
}
async function saveFile(filename,data){
  toast('Export wird vorbereitet …');
  const d=await getDl();
  if(d){
    try{ await d.save({filename,data}); toast('Gespeichert: '+filename); }
    catch(err){ if(err&&err.code==='declined') toastEl.hidden=true; else toast('Speichern hat nicht geklappt. Bitte noch einmal versuchen.'); }
    return;
  }
  const ext=filename.split('.').pop(), mime={png:'image/png',svg:'image/svg+xml',pdf:'application/pdf',json:'application/json'}[ext]||'application/octet-stream';
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&navigator.canShare){
    const f=new File([data],filename,{type:mime});
    if(navigator.canShare({files:[f]})){
      try{ await navigator.share({files:[f]}); toastEl.hidden=true; return; }
      catch(e){ if(e&&e.name==='AbortError'){ toastEl.hidden=true; return; } }
    }
  }
  try{
    const a=document.createElement('a'), url=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:mime}));
    a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),10000);
    toast('Download gestartet: '+filename+'. Kommt nichts an, lade die Seite neu und versuche es noch einmal.');
  }catch(e){ toast('In dieser Ansicht sind keine Downloads möglich. Lade die Seite neu oder öffne sie im Browser.'); }
}
function rasterize(mime,scaleMax){
  return new Promise((res,rej)=>{
    const s=buildSVG(); if(!s) return rej('empty');
    const img=new Image();
    img.onload=()=>{ const sc=Math.min(scaleMax,6000/Math.max(s.w,s.h)),c=document.createElement('canvas');
      c.width=Math.round(s.w*sc); c.height=Math.round(s.h*sc); const g=c.getContext('2d');
      g.fillStyle=darkBoard?paper():'#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>b?res({blob:b,w:c.width,h:c.height}):rej('render'),mime,0.93); };
    img.onerror=()=>rej('render');
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s.svg);
  });
}
async function makePDF(jpegBlob,iw,ih){
  const jpg=new Uint8Array(await jpegBlob.arrayBuffer());
  const land=iw>=ih, PW=land?841.89:595.28, PH=land?595.28:841.89, M=28;
  const sc=Math.min((PW-2*M)/iw,(PH-2*M)/ih), w=iw*sc, h=ih*sc, px=(PW-w)/2, py=(PH-h)/2;
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const add=p=>{ const b=typeof p==='string'?enc.encode(p):p; parts.push(b); len+=b.length; };
  const obj=(n,body)=>{ offs[n]=len; add(n+' 0 obj\n'); body(); add('\nendobj\n'); };
  add('%PDF-1.4\n');
  obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>add('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3,()=>add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`));
  obj(4,()=>{ add(`<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); add(jpg); add('\nendstream'); });
  const cs=`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${px.toFixed(2)} ${py.toFixed(2)} cm /Im0 Do Q`;
  obj(5,()=>add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
  const xref=len; let t='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++) t+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(t+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}
async function exportAs(kind){
  try{
    if(kind==='svg'){ const s=buildSVG(); if(!s) throw 'empty'; return saveFile(fileBase()+'.svg',s.svg); }
    const rr=await rasterize(kind==='png'?'image/png':'image/jpeg',kind==='png'?2:3);
    await saveFile(fileBase()+'.'+kind,kind==='png'?rr.blob:await makePDF(rr.blob,rr.w,rr.h));
  }catch(e){ toast(e==='empty'?'Das Board ist leer.':'Der Export hat nicht geklappt. Bitte noch einmal versuchen.'); }
}
menu.addEventListener('click',e=>{
  const bb=e.target.closest('[data-b]');
  if(bb){ menu.hidden=true; if(bb.dataset.b!==boards.cur) openBoard(bb.dataset.b); return; }
  const b=e.target.closest('[data-m]'); if(!b) return;
  if(b.dataset.m==='delboard'&&!b.dataset.sure){ b.dataset.sure='1'; b.textContent='Wirklich löschen? Das lässt sich nicht zurückholen.'; e.stopPropagation(); return; }
  menu.hidden=true; finishEdit();
  switch(b.dataset.m){
    case 'new': newBoard(); break;
    case 'delboard': deleteBoard(); break;
    case 'png': case 'svg': case 'pdf': exportAs(b.dataset.m); break;
    case 'json': saveFile(fileBase()+'.json',JSON.stringify(doc)); break;
    case 'open': $('file').value=''; $('file').click(); break;
    case 'example': doc=exampleDoc(); sel.clear(); commit(); render(); fit(); break;
    case 'clear': doc={items:[],n:doc.n}; sel.clear(); commit(); render(); toast('Board geleert. Mit „Zurück“ holst du alles wieder.'); break;
  }
});
$('boardName').addEventListener('input',e=>{ curBoard().name=e.target.value.trim()||'Board'; saveIdx(); });
$('boardName').addEventListener('keydown',e=>{ if(e.key==='Enter') e.target.blur(); });
$('file').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ const d=JSON.parse(await f.text()); if(!d||!Array.isArray(d.items)) throw 0;
    doc={items:d.items,n:d.n||d.items.length+1000}; sel.clear(); commit(); render(); fit(); }
  catch(_){ toast('Diese Datei ist kein Blackboard-Projekt (.json).'); }
});
document.addEventListener('keydown',e=>{
  const t=e.target; if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT')) return;
  const mod=e.ctrlKey||e.metaKey, k=e.key.toLowerCase();
  if(e.key===' '&&!(t&&t.tagName==='BUTTON')){ spaceDown=true; e.preventDefault(); return; }
  if(mod&&k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod&&k==='y'){ e.preventDefault(); redo(); return; }
  if(mod&&k==='d'){ e.preventDefault(); duplicateSel(); return; }
  if(mod&&k==='a'){ e.preventDefault(); setTool('select'); sel=new Set(doc.items.map(i=>i.id)); render(); return; }
  if(mod) return;
  if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); deleteSel(); return; }
  if(e.key==='Escape'){ cancelAction(); sel.clear(); setTool('select'); render(); return; }
  if((e.key==='Enter'||e.key==='F2')&&sel.size===1){ e.preventDefault(); startEdit([...sel][0]); return; }
  if(e.key.startsWith('Arrow')&&sel.size){ e.preventDefault(); const st=e.shiftKey?1:GRID, dx=k==='arrowleft'?-st:k==='arrowright'?st:0, dy=k==='arrowup'?-st:k==='arrowdown'?st:0;
    for(const it of [...sel].map(byId)){ if(!it) continue; if(it.type==='shape'){ it.x+=dx; it.y+=dy; } else if(it.type==='path') it.pts=it.pts.map(p=>[p[0]+dx,p[1]+dy]); }
    commit(); render(); return; }
  const map={v:'select',p:'pen',b:'brush',m:'marker',l:'conn',t:'text',e:'erase',h:'pan'}; if(map[k]) setTool(map[k]);
});
document.addEventListener('keyup',e=>{ if(e.key===' ') spaceDown=false; });
window.addEventListener('resize',()=>applyView());

/* ---------- Beispiel und Start ---------- */
function exampleDoc(){
  const d={items:[],n:0}, id=()=>'i'+(++d.n);
  const S=(kind,x,y,text,o)=>{ const k=KINDS[kind],s=Object.assign({id:id(),type:'shape',kind,x,y,w:k.w,h:k.h,text:text||'',fill:k.fill||'#ffffff',stroke:INK,sw:2},o||{}); d.items.push(s); return s.id; };
  const C=(from,to,text,o)=>d.items.push(Object.assign({id:id(),type:'conn',from,to,p1:{x:0,y:0},p2:{x:0,y:0},text:text||'',stroke:INK,sw:2,style:'ortho',arrow:true,dash:false},o||{}));
  S('pool',40,40,'Urlaubsantrag',{w:900,h:320,fill:'#e3e8ea'});
  const st=S('evstart',100,180,'Urlaub geplant',{fill:'#d3f0dc'});
  const a=S('round',190,160,'Antrag ausfüllen');
  const b=S('round',380,160,'Antrag prüfen',{fill:'#cfe8ff'});
  const g=S('gwx',570,175,'Genehmigt?');
  const y=S('round',700,80,'Urlaub eintragen',{fill:'#d3f0dc'});
  const n=S('round',700,240,'Absage begründen',{fill:'#ffd9c7'});
  const e1=S('evend',880,100,''), e2=S('evend',880,260,'');
  C(st,a); C(a,b); C(b,g); C(g,y,'Ja'); C(g,n,'Nein'); C(y,e1); C(n,e2);
  S('note',40,390,'Beispiel: Formen anklicken und verschieben, Doppelklick ändert den Text.',{w:230,h:90});
  return d;
}
function start(data){
  setBoardBg(lsGet('blackboard-bg')!=='light',true);
  loadBoards();
  const hot=data&&data.doc&&Array.isArray(data.doc.items)?data.doc:null;
  doc=hot||storedDoc(boards.cur)||exampleDoc(); hist=[]; hi=-1; commit(); setTool('select'); render();
  $('boardName').value=curBoard().name;
  if(data&&data.view){ view=data.view; applyView(); } else fit();
}
try{ window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({doc,view})); }catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
getDl();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
