# Prüft bei jeder Änderung automatisch, ob Skizix noch funktioniert.
# Ergebnis: grüner Haken oder rotes Kreuz neben der Änderung auf GitHub (Reiter "Actions").
name: Tests
on:
  push:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge installieren
        run: |
          pip install playwright
          sudo apt-get update && sudo apt-get install -y poppler-utils qpdf
      - name: Passt index.html zum Quellcode?
        run: python3 quelle/build.py --pruefen
      - name: Alle Tests
        run: python3 quelle/tests/alle_tests.py
        env:
          BB_CHROME: /usr/bin/google-chrome
